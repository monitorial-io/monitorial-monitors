version: 2

macros:
  - name: high_data_churn
    description: "Detects tables with high data churn where time-travel and failsafe storage significantly exceeds active storage. This indicates frequent DML operations creating excessive overhead, particularly costly for permanent tables where failsafe is enforced."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "warning"
        message: "High data churn tables detected"
        message_type: "storage"
        environment: "account"
    arguments:
      - name: churn_ratio_threshold
        type: float
        description: "Minimum ratio of (time_travel + failsafe) / active storage to flag; default = 2.0"

  - name: short_lived_tables
    description: "Detects tables that were created and dropped within a short time window. Frequent short-lived permanent tables waste storage on time-travel and failsafe. Consider using transient tables for ETL staging."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "info"
        message: "Short-lived tables detected"
        message_type: "storage"
        environment: "account"
    arguments:
      - name: lifespan_hours
        type: integer
        description: "Maximum lifespan in hours for a table to be considered short-lived; default = 24"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: storage_growth_anomaly
    description: "Detects month-over-month storage growth that exceeds a threshold percentage. Rapid storage growth may indicate data duplication, failed cleanup processes, or unbounded ingestion."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 1 * *"
        severity: "warning"
        message: "Storage growth anomaly detected"
        message_type: "storage"
        environment: "account"
    arguments:
      - name: growth_pct_threshold
        type: integer
        description: "Minimum month-over-month growth percentage to trigger alert; default = 20"

  - name: unused_objects
    description: "Identifies tables with significant storage that have not been accessed in the specified number of days. Candidates for archival or deletion to reduce storage costs."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "info"
        message: "Unused objects with significant storage detected"
        message_type: "storage"
        environment: "account"
    arguments:
      - name: days_inactive
        type: integer
        description: "Number of days without access to consider an object unused; default = 90"
