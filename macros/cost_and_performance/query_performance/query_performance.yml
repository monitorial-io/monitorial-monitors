version: 2

macros:
  - name: warehouse_spilling
    description: "Detects warehouses with queries spilling to local or remote storage — critical performance issues."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "critical"
        message: "Warehouse query spilling detected"
        message_type: "cost_and_performance"
        environment: "account"
    arguments:
      - name: remote_spill_threshold
        type: integer
        description: "Minimum remote spill count to trigger; default = 0"
      - name: local_spill_gb_threshold
        type: integer
        description: "Minimum local spill in GB; default = 1"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes; default = 10080 (7 days)"

  - name: warehouse_poor_pruning
    description: "Detects queries scanning >90% of partitions in large tables — indicates missing or ineffective clustering."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Queries with poor partition pruning detected"
        message_type: "cost_and_performance"
        environment: "account"
    arguments:
      - name: scan_pct_threshold
        type: integer
        description: "Minimum scan percentage to flag; default = 90"
      - name: min_partitions
        type: integer
        description: "Minimum total partitions for evaluation; default = 100"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes; default = 10080 (7 days)"

  - name: query_spilling
    description: "Detects queries flagged by Query Insights with spill issues."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Queries with spilling detected via Query Insights"
        message_type: "cost_and_performance"
        environment: "account"
    arguments:
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes; default = 10080 (7 days)"

  - name: cardinality_explosion
    description: "Detects queries with cardinality explosion from bad join conditions."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "critical"
        message: "Cardinality explosion queries detected"
        message_type: "cost_and_performance"
        environment: "account"
    arguments:
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes; default = 10080 (7 days)"

  - name: complex_query_compilation
    description: "Detects queries with excessive compilation time from deeply nested CTEs or complex views."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "info"
        message: "Queries with excessive compilation time detected"
        message_type: "cost_and_performance"
        environment: "account"
    arguments:
      - name: compilation_time_ms
        type: integer
        description: "Minimum compilation time in ms; default = 10000"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes; default = 10080 (7 days)"

  - name: deeply_stacked_views
    description: "Detects views with excessive nesting depth using recursive lineage analysis."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "info"
        message: "Deeply stacked views detected"
        message_type: "cost_and_performance"
        environment: "account"
    arguments:
      - name: max_depth
        type: integer
        description: "Maximum acceptable view nesting depth; default = 5"

  - name: micro_transactions
    description: "Detects RBAR patterns — high-frequency DML with minimal rows affected per execution."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Micro-transaction RBAR pattern detected"
        message_type: "cost_and_performance"
        environment: "account"
    arguments:
      - name: query_types
        type: List[string]
        description: "List of query types to monitor; default = INSERT, UPDATE, DELETE, MERGE"
      - name: min_count
        type: integer
        description: "Minimum occurrence count to flag; default = 50"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes; default = 1440 (1 day)"

  - name: long_running_queries
    description: "Detects queries that have been running longer than the specified time frame."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Long running queries detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: minutes
        type: integer
        description: "The number of minutes to look back for query execution; default = 5"

  - name: rbar_detection
    description: "Detects row-by-row processing queries repeatedly executed within the same session — high priority for tuning."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "High volume row by row queries in same session"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: query_types
        type: List[string]
        description: "The list of query types monitored; default = SELECT, INSERT, UPDATE, MERGE"
      - name: query_count_greater_than
        type: integer
        description: "The lower boundary of query occurrences to alert on; default = 10"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 1440 (1 day)"
