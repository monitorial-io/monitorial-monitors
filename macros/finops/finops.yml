version: 2

macros:
  - name: cost_anomaly_detection
    description: "Detects days with credit consumption significantly above the historical average. Uses standard deviation-based z-score analysis to identify anomalous spending days that may indicate runaway queries or misconfigured workloads."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * *"
        severity: "warning"
        message: "Cost anomaly detected - daily credits significantly above average"
        message_type: "finops"
        environment: "account"
    arguments:
      - name: percent_change_threshold
        type: integer
        description: "Minimum percent above average to flag as anomaly; default = 50"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: serverless_cost_spike
    description: "Monitors serverless service credit consumption (auto-clustering, serverless tasks, materialized views, search optimization). Alerts when any service exceeds a credit threshold indicating unexpected cost growth."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * *"
        severity: "warning"
        message: "Serverless service cost spike detected"
        message_type: "finops"
        environment: "account"
    arguments:
      - name: credit_threshold
        type: integer
        description: "Minimum credits for a serverless service to trigger alert; default = 10"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: resource_monitor_coverage_gap
    description: "Identifies warehouses with significant credit consumption that are not covered by any resource monitor. Unmonitored warehouses pose a risk of unbounded cost accumulation."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * 1"
        severity: "warning"
        message: "High-spend warehouses without resource monitors detected"
        message_type: "finops"
        environment: "account"
    arguments:
      - name: min_monthly_credits
        type: integer
        description: "Minimum monthly credits for a warehouse to be flagged; default = 100"

  - name: single_row_inserts
    description: "Detects INSERT statements that load only 1 row per execution, repeated many times. This anti-pattern causes excessive cloud services overhead and should be replaced with batch inserts or streaming ingestion."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * *"
        severity: "warning"
        message: "Single-row INSERT anti-pattern detected"
        message_type: "finops"
        environment: "account"
    arguments:
      - name: min_insert_count
        type: integer
        description: "Minimum number of single-row inserts to trigger alert; default = 100"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: high_frequency_short_queries
    description: "Detects SELECT queries with very short execution time (<100ms) that are executed thousands of times. These often indicate application-level polling or inefficient lookup patterns that could be consolidated or cached."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * *"
        severity: "info"
        message: "High-frequency short queries detected"
        message_type: "finops"
        environment: "account"
    arguments:
      - name: min_execution_count
        type: integer
        description: "Minimum execution count for a query pattern to be flagged; default = 1000"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: high_frequency_show_commands
    description: "Detects SHOW commands executed at very high frequency, often caused by BI tools or orchestration frameworks polling metadata. These contribute to cloud services overhead."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * *"
        severity: "info"
        message: "High-frequency SHOW commands detected"
        message_type: "finops"
        environment: "account"
    arguments:
      - name: min_execution_count
        type: integer
        description: "Minimum execution count for a command to be flagged; default = 500"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: cloud_services_overhead
    description: "Breaks down cloud services credit consumption by pattern type (SHOW commands, short queries, metadata scans, single-row inserts). Helps identify the largest contributors to cloud services overhead that may exceed the 10% adjustment threshold."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * 1"
        severity: "info"
        message: "Cloud services overhead breakdown available"
        message_type: "finops"
        environment: "account"
    arguments:
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: copy_command_inefficiency
    description: "Detects COPY INTO commands with poor selectivity - long execution times but very few rows loaded. These indicate file listing overhead, redundant copy patterns, or already-loaded file re-scanning."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * *"
        severity: "warning"
        message: "Inefficient COPY commands detected"
        message_type: "finops"
        environment: "account"
    arguments:
      - name: min_execution_count
        type: integer
        description: "Minimum execution count for a pattern to be flagged; default = 10"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: budget_utilization_warning
    description: "Monitors month-to-date credit consumption against a budget threshold and projects days until budget exhaustion based on recent daily average spend."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 8 * * *"
        severity: "warning"
        message: "Budget utilization warning - approaching limit"
        message_type: "finops"
        environment: "account"
    arguments:
      - name: budget_limit_credits
        type: integer
        description: "Monthly credit budget limit; default = 500"
      - name: warning_pct
        type: integer
        description: "Utilization percentage threshold to trigger warning; default = 75"
