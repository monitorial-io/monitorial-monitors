version: 2

macros:
  - name: query_spilling
    description: "Detects queries flagged by Snowflake Query Insights with spill issues. Queries that spill to local or remote storage are significantly slower and consume more resources. Remote spills indicate the warehouse is undersized for the workload."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Queries with spilling detected via Query Insights"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 10080 (7 days)"

  - name: cardinality_explosion
    description: "Detects queries flagged by Snowflake Query Insights with cardinality explosion issues. These queries produce far more rows than expected due to bad join conditions (cross joins, many-to-many), causing memory pressure and slow performance."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "critical"
        message: "Cardinality explosion queries detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 10080 (7 days)"

  - name: deeply_stacked_views
    description: "Detects views with excessive nesting depth using recursive lineage analysis. Deeply stacked views (>5 layers) make debugging difficult, increase compilation time, and prevent the optimizer from generating efficient plans."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "info"
        message: "Deeply stacked views detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: max_depth
        type: integer
        description: "Maximum acceptable view nesting depth; default = 5"

  - name: micro_transactions
    description: "Detects high-frequency DML operations with very short execution time and minimal rows affected. This Row-By-Agonizing-Row (RBAR) pattern should be replaced with batch operations for better performance and lower cost."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Micro-transaction RBAR pattern detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: query_types
        type: List[string]
        description: "List of query types to monitor; default = INSERT, UPDATE, DELETE, MERGE"
      - name: min_count
        type: integer
        description: "Minimum occurrence count to flag; default = 50"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 1440 (1 day)"

  - name: materialized_view_refresh_cost
    description: "Monitors materialized view refresh credit consumption. High refresh costs may indicate the MV is refreshing too frequently relative to its value, or that the underlying data changes too often for an MV to be cost-effective."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "info"
        message: "Materialized view with high refresh costs detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: credit_threshold
        type: float
        description: "Minimum total credits to flag a materialized view; default = 1"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: complex_query_compilation
    description: "Detects queries with excessive compilation time, often caused by deeply nested CTEs, complex views, or very large SQL statements. High compilation time consumes cloud services credits and slows query response."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "info"
        message: "Queries with excessive compilation time detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: compilation_time_ms
        type: integer
        description: "Minimum compilation time in milliseconds to flag; default = 10000 (10 seconds)"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 10080 (7 days)"
