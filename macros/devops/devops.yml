version: 2

macros:
  - name: dynamic_table_refresh_failures
    description: "Detects Dynamic Tables with failed or stalled refreshes. Failed DT refreshes break downstream data pipelines and indicate issues with upstream sources, resource constraints, or SQL errors."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 */4 * * *"
        severity: "critical"
        message: "Dynamic Table refresh failures detected"
        message_type: "devops"
        environment: "account"
    arguments:
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 1440 (1 day)"

  - name: low_declarative_ddl_adoption
    description: "Monitors the ratio of declarative DDL patterns (CREATE OR ALTER, EXECUTE IMMEDIATE FROM) vs imperative DDL. Low declarative adoption indicates the account is not leveraging modern DevOps practices like Database Change Management."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "info"
        message: "Low declarative DDL adoption detected"
        message_type: "devops"
        environment: "account"
    arguments:
      - name: min_declarative_pct
        type: integer
        description: "Minimum percentage of declarative DDL operations expected; default = 10"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: git_integration_inactive
    description: "Detects Git integrations that have not been used (no fetch or execute operations) in the specified time window. Inactive Git integrations may indicate abandoned CI/CD pipelines or failed automation."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "info"
        message: "Inactive Git integrations detected"
        message_type: "devops"
        environment: "account"
    arguments:
      - name: days_inactive
        type: integer
        description: "Number of days without activity to consider inactive; default = 30"
