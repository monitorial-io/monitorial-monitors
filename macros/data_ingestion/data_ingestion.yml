version: 2

macros:
  - name: snowpipe_idle_credits
    description: "Detects Snowpipes that are consuming credits without loading data, or with very poor cost-per-GB efficiency. Idle pipes burn credits via notification channel overhead even when no files arrive."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * *"
        severity: "warning"
        message: "Snowpipe idle or high-cost-per-GB detected"
        message_type: "data_ingestion"
        environment: "account"
    arguments:
      - name: idle_credit_threshold
        type: float
        description: "Minimum credits for a pipe to be evaluated; default = 0.5"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: snowpipe_streaming_cost_spike
    description: "Detects days where Snowpipe Streaming credit consumption spikes significantly above the historical average, indicating possible upstream volume changes or misconfigurations."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * *"
        severity: "warning"
        message: "Snowpipe Streaming cost spike detected"
        message_type: "data_ingestion"
        environment: "account"
    arguments:
      - name: percent_change_threshold
        type: integer
        description: "Minimum percent above average to flag; default = 50"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: bulk_load_small_files
    description: "Detects COPY or Snowpipe loads with very small average file sizes. Small files (<10MB) are inefficient for Snowflake ingestion and should be concatenated upstream for optimal performance."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * *"
        severity: "warning"
        message: "Bulk load with small files detected"
        message_type: "data_ingestion"
        environment: "account"
    arguments:
      - name: avg_file_mb_threshold
        type: integer
        description: "Maximum average file size in MB to flag; default = 10"
      - name: min_files
        type: integer
        description: "Minimum number of files loaded to be evaluated; default = 100"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"

  - name: ingestion_method_cost_comparison
    description: "Compares credit consumption across ingestion methods (Snowpipe, Bulk COPY, Streaming) to identify which method is most expensive and whether a different approach would be more cost-effective."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 7 * * 1"
        severity: "info"
        message: "Ingestion method cost comparison available"
        message_type: "data_ingestion"
        environment: "account"
    arguments:
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 43200 (30 days)"
