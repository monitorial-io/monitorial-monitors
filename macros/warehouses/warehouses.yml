version: 2

macros:
  - name: warehouse_idle_credits
    description: "Detects warehouses with high idle credit waste. Idle credits are compute credits consumed while the warehouse is running but not actively processing queries. High idle percentage indicates auto-suspend timeout is too long."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Warehouse idle credit waste detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: idle_percent_threshold
        type: integer
        description: "Minimum idle percentage to trigger alert; default = 30"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 10080 (7 days)"

  - name: warehouse_oversizing
    description: "Detects warehouses that are oversized for their workloads. Compares partitions scanned against the node count for the warehouse size. A high percentage of queries scanning fewer partitions than available nodes indicates the warehouse is too large."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Oversized warehouse detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: pct_oversized_threshold
        type: integer
        description: "Minimum percentage of oversized queries to trigger alert; default = 50"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 10080 (7 days)"

  - name: warehouse_spilling
    description: "Detects warehouses with queries spilling data to local or remote storage. Remote spills are critical performance issues indicating the warehouse is undersized for the query workload. Local spills degrade performance but are less severe."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "critical"
        message: "Warehouse query spilling detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: remote_spill_threshold
        type: integer
        description: "Minimum remote spill count to trigger alert; default = 0 (any remote spill)"
      - name: local_spill_gb_threshold
        type: integer
        description: "Minimum local spill in GB to trigger alert; default = 1"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 10080 (7 days)"

  - name: warehouse_always_on
    description: "Detects warehouses that are running nearly 24/7 which may indicate misconfigured auto-suspend settings or workloads that should be consolidated."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Always-on warehouse detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: avg_hours_threshold
        type: integer
        description: "Average hours per day a warehouse must run to be flagged; default = 20"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 10080 (7 days)"

  - name: warehouse_cost_spike
    description: "Detects warehouses with significant week-over-week credit consumption increases. Helps identify unexpected cost spikes early before they accumulate."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "warning"
        message: "Warehouse cost spike detected week-over-week"
        message_type: "finops"
        environment: "account"
    arguments:
      - name: percent_change_threshold
        type: integer
        description: "Minimum week-over-week percent increase to trigger alert; default = 50"
      - name: min_credits
        type: integer
        description: "Minimum credits in either week for the warehouse to be evaluated; default = 10"

  - name: warehouse_queuing
    description: "Detects warehouses with query queuing, indicating the warehouse cannot keep up with demand. Sustained queuing degrades user experience and may require scaling up or out."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 */4 * * *"
        severity: "warning"
        message: "Warehouse query queuing detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: avg_queue_threshold
        type: float
        description: "Average queued load threshold to trigger alert; default = 0.1"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 10080 (7 days)"

  - name: warehouse_poor_pruning
    description: "Detects queries scanning over 90% of partitions in large tables. Poor pruning indicates missing or ineffective clustering keys, leading to full table scans and excessive credit consumption."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Queries with poor partition pruning detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: scan_pct_threshold
        type: integer
        description: "Minimum scan percentage to flag a query; default = 90"
      - name: min_partitions
        type: integer
        description: "Minimum total partitions for a table to be evaluated; default = 100"
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 10080 (7 days)"

  - name: warehouse_scaling_efficiency
    description: "Combined oversizing and idle analysis per warehouse with actionable recommendations. Identifies warehouses that are both oversized for their data volumes and idle for significant periods, indicating the highest optimization opportunities."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "info"
        message: "Warehouse scaling efficiency issues detected"
        message_type: "performance"
        environment: "account"
    arguments:
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window; default = 10080 (7 days)"
