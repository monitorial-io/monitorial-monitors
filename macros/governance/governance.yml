version: 2

macros:
  - name: untagged_sensitive_columns
    description: "Identifies columns that appear to contain sensitive data (based on naming patterns like EMAIL, SSN, PHONE, etc.) but have no governance tags applied. These represent classification gaps that may violate compliance requirements."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "warning"
        message: "Potentially sensitive columns without tags detected"
        message_type: "governance"
        environment: "account"
    arguments: []

  - name: masking_policy_coverage_gap
    description: "Identifies columns tagged as sensitive (PII, PHI, PCI, GDPR sensitivity) that do not have a masking policy applied. These represent data protection gaps where sensitive data is exposed to users without appropriate access controls."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "critical"
        message: "Sensitive columns without masking policy detected"
        message_type: "governance"
        environment: "account"
    arguments: []

  - name: row_access_policy_gap
    description: "Identifies tables that contain sensitive-tagged columns but have no row access policy applied. Without row-level security, all users with table access can see all rows regardless of data sensitivity."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "warning"
        message: "Tables with sensitive data but no row access policy"
        message_type: "governance"
        environment: "account"
    arguments: []

  - name: dangling_policies
    description: "Detects masking policies, row access policies, or other governance policies that reference dropped or deleted objects. These orphaned policies indicate cleanup gaps and may cause confusion during audits."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "info"
        message: "Dangling governance policies detected"
        message_type: "governance"
        environment: "account"
    arguments: []

  - name: stale_tagged_tables
    description: "Identifies tables that have governance tags applied but have not been modified in over 90 days. Stale tagged data may indicate abandoned datasets that should be reviewed for archival or de-tagging."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 1 * *"
        severity: "info"
        message: "Stale tagged tables detected (>90 days without modification)"
        message_type: "governance"
        environment: "account"
    arguments:
      - name: days_stale
        type: integer
        description: "Number of days without modification to consider stale; default = 90"

  - name: downstream_lineage_gaps
    description: "Identifies downstream objects (views, tables) that depend on tagged/protected source tables but do not themselves have tags or policies applied. This represents governance leakage where sensitive data flows unprotected."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "warning"
        message: "Downstream lineage governance gaps detected"
        message_type: "governance"
        environment: "account"
    arguments: []
