        severity: "warning"
        message: "New share exposures detected"
        message_type: "security"
        environment: "account"
    arguments: []

  - name: monitoring_password_signin_without_mfa
    description: "Monitors password sign-ins without MFA (CIS 2.4)."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Password sign-in without MFA detected"
        message_type: "security"
        environment: "account"
    arguments: []

  - name: monitoring_password_signins_sso_users
    description: "Monitors SSO users signing in with password instead of SSO."
    docs:
