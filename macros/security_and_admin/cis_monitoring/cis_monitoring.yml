version: 2

macros:
  - name: monitoring_accountadmin_securityadmin_role_grants
    description: "Monitors ACCOUNTADMIN and SECURITYADMIN role grant events (CIS 2.1)."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Admin role grants detected"
        message_type: "security"
        environment: "account"
    arguments: []

  - name: monitoring_manage_grants
    description: "Monitors MANAGE GRANTS privilege grants (CIS 2.2)."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "MANAGE GRANTS privilege granted"
        message_type: "security"
        environment: "account"
    arguments: []

  - name: monitoring_network_policies
    description: "Monitors network policy changes (CIS 2.6)."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Network policy changes detected"
        message_type: "security"
        environment: "account"
    arguments: []

  - name: monitoring_new_share_exposures
