  - name: monitoring_scim_token_creation
    description: "Monitors SCIM token creation events (CIS 2.7)."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "SCIM token creation detected"
        message_type: "security"
        environment: "account"
    arguments: []

  - name: monitoring_security_integrations
    description: "Monitors security integration changes (CIS 2.5)."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Security integration changes detected"
        message_type: "security"
        environment: "account"
    arguments: []

  - name: monitoring_unsupported_snowflake_connector
    description: "Monitors for unsupported Snowflake connector sessions (CIS 2.9)."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "info"
        message: "Unsupported connector sessions detected"
        message_type: "security"
        environment: "account"
    arguments: []

  - name: integration_object_changes
    description: "Monitors new or modified integrations — integrations can enable new means of access to data."
    docs:
      show: true
    monitorial:
      version: 1.0.1
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Changes to Integrations detected"
        message_type: "security"
        environment: "account"
    arguments:
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window"

  - name: security_integration_changes
    description: "Monitors new or modified security integrations — can enable new means of access to data."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "warning"
        message: "Changes to Security Integration detected"
        message_type: "security"
        environment: "account"
    arguments:
      - name: time_filter
        type: integer
        description: "Retrospective time period in minutes for the query window"
