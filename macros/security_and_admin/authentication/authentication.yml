version: 2

macros:
  - name: privileged_users_no_mfa
    description: "Detects users with privileged roles (ACCOUNTADMIN, SECURITYADMIN, etc.) using password auth without MFA."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * *"
        severity: "critical"
        message: "Privileged users without MFA detected"
        message_type: "security"
        environment: "account"
    arguments: []

  - name: inactive_privileged_users
    description: "Detects privileged users who have not logged in for a specified number of days."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "warning"
        message: "Inactive privileged users detected"
        message_type: "security"
        environment: "account"
    arguments:
      - name: days_inactive
        type: integer
        description: "Number of days without login to flag; default = 90"

  - name: personal_access_tokens
    description: "Lists users with personal access tokens — long-lived credentials that should be monitored."
    docs:
      show: true
    monitorial:
      version: 1.0.0
      defaults:
        schedule: "0 6 * * 1"
        severity: "info"
        message: "Users with personal access tokens detected"
        message_type: "security"
        environment: "account"
    arguments: []
